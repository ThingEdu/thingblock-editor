  <!-- các vòng đốt, gợi thân cây tre -->
  <path d="M57 110 H143" stroke="#2b2b2b" stroke-width="3" opacity="0.55"/>
  <path d="M57 132 H143" stroke="#2b2b2b" stroke-width="3" opacity="0.55"/>

