<svg xmlns="http://www.w3.org/2000/svg" width="600" height="372" viewBox="0 0 600 372">
  <rect width="600" height="372" fill="#f3f4f6"/>
  <!-- Sensor board -->
  <rect x="190" y="70" width="220" height="232" rx="18" fill="#1f2937"/>
  <circle cx="218" cy="98" r="10" fill="#f3f4f6"/>
  <circle cx="382" cy="98" r="10" fill="#f3f4f6"/>
  <!-- Pins: VCC, GND, SDA, SCL -->
  <g fill="#d1d5db">
    <rect x="222" y="270" width="22" height="46" rx="4"/>
    <rect x="266" y="270" width="22" height="46" rx="4"/>
    <rect x="312" y="270" width="22" height="46" rx="4"/>
    <rect x="356" y="270" width="22" height="46" rx="4"/>
  </g>
  <!-- White LED and the colour chip -->
  <circle cx="300" cy="170" r="46" fill="#fef9c3"/>
  <circle cx="300" cy="170" r="30" fill="#ffffff"/>
  <rect x="256" y="226" width="88" height="30" rx="6" fill="#111827"/>
  <g>
    <rect x="270" y="234" width="16" height="14" rx="2" fill="#ef4444"/>
    <rect x="292" y="234" width="16" height="14" rx="2" fill="#22c55e"/>
    <rect x="314" y="234" width="16" height="14" rx="2" fill="#3b82f6"/>
  </g>
  <!-- Red, green, blue readings -->
  <circle cx="110" cy="120" r="40" fill="#ef4444" opacity="0.9"/>
  <circle cx="110" cy="250" r="40" fill="#22c55e" opacity="0.9"/>
  <circle cx="490" cy="186" r="40" fill="#3b82f6" opacity="0.9"/>
  <g stroke="#9ca3af" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10">
    <line x1="152" y1="128" x2="184" y2="150"/>
    <line x1="152" y1="242" x2="184" y2="220"/>
    <line x1="448" y1="186" x2="416" y2="186"/>
  </g>
</svg>
